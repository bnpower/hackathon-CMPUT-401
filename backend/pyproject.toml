[project]
name = "hire-power-backend"
version = "0.1.0"
description = "Django REST backend for Hire Power"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<4.0",
    "django-cors-headers>=4.9,<5.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "google-auth>=2.35,<3.0",
    "requests>=2.32,<3.0",
    "gunicorn>=23.0,<24.0",
    "dj-database-url>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "whitenoise>=6.8,<7.0",
    "pypdf>=5.0,<6.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
