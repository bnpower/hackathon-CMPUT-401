name: Deploy to Cybera RAC

on:
  push:
    branches: [main, brady]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.RAC_HOST }}
          username: ${{ secrets.RAC_USERNAME }}
          key: ${{ secrets.RAC_SSH_KEY }}
          port: ${{ secrets.RAC_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ env.APP_DIR }}"
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f

      - name: Wait for services to come up
        run: sleep 10

      # RAC_HOST is an IPv6 literal (Cybera RAC instances get IPv6 by default,
      # no floating IPv4) so URLs need bracket notation; ssh's `host` field above
      # takes the bare address.
      - name: Health check - frontend
        run: curl -sf -o /dev/null "http://[${{ secrets.RAC_HOST }}]/"

      - name: Health check - backend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "http://[${{ secrets.RAC_HOST }}]:8000/api/auth/me/")
          if [ "$status" != "401" ]; then
            echo "Expected 401 (auth required) from backend, got $status"
            exit 1
          fi
