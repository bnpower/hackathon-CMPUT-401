name: Deploy to Cybera RAC

on:
  push:
    branches: [main, brady]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/app

jobs:
  deploy:
    # Runs on a self-hosted runner installed directly on the Cybera RAC instance.
    # GitHub-hosted runners have no IPv6 egress and this instance has no public
    # IPv4 (floating IPs aren't available for this project), so there's no way
    # for a hosted runner to reach it over SSH. A self-hosted runner sidesteps
    # that entirely: it polls GitHub over an outbound connection (the same
    # direction as `git clone`/`docker pull`, which already work fine here), so
    # nothing needs to connect inbound to the box at all - the job just runs
    # locally on it.
    runs-on: [self-hosted, rac]
    steps:
      - name: Pull latest and deploy
        run: |
          set -euo pipefail
          cd "${{ env.APP_DIR }}"
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f

      - name: Wait for services to come up
        run: sleep 10

      - name: Health check - frontend
        run: curl -sf -o /dev/null "http://localhost/"

      - name: Health check - backend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/api/auth/me/")
          if [ "$status" != "401" ]; then
            echo "Expected 401 (auth required) from backend, got $status"
            exit 1
          fi
