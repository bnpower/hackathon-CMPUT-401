name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py test
      - run: python manage.py check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    env:
      CYBERA_HOST: ${{ secrets.CYBERA_HOST }}
      CYBERA_PORT: ${{ secrets.CYBERA_PORT }}
      CYBERA_SSH_KEY: ${{ secrets.CYBERA_SSH_KEY }}
      CYBERA_TARGET_DIR: ${{ secrets.CYBERA_TARGET_DIR }}
      CYBERA_USER: ${{ secrets.CYBERA_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate deployment secrets
        run: |
          set -euo pipefail
          for name in CYBERA_HOST CYBERA_SSH_KEY CYBERA_TARGET_DIR CYBERA_USER; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$CYBERA_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${CYBERA_PORT:-22}" "$CYBERA_HOST" >> ~/.ssh/known_hosts
      - name: Sync repository to Cybera RAC
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'backend/.venv/' \
            --exclude 'backend/db.sqlite3' \
            --exclude 'frontend/node_modules/' \
            -e "ssh -p ${CYBERA_PORT:-22}" \
            ./ "${CYBERA_USER}@${CYBERA_HOST}:${CYBERA_TARGET_DIR}/"
      - name: Run remote deployment script
        run: |
          set -euo pipefail
          ssh -p "${CYBERA_PORT:-22}" "${CYBERA_USER}@${CYBERA_HOST}" \
            "bash '${CYBERA_TARGET_DIR}/scripts/deploy_cybera_rac.sh'"
